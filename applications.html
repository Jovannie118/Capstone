<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications - Paracale Scholarships</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <div class="page-header">
    <h1>Applications</h1>
    <p>Search by name, application ID, email or mobile number. Filter by status or document verification state.</p>
  </div>
  <div id="body"></div>
</main>

<script src="assets/js/app.js"></script>
<script>
footer();

function detail(app) {
  const docs = app.documents.map((d) => (
    '<tr><td>' + esc(d.doc_type) + '</td>' +
    '<td class="muted small">' + esc(d.file_name) + '</td>' +
    '<td>' + statusBadge(d.status) + (d.note ? '<div class="muted small">' + esc(d.note) + '</div>' : '') + '</td>' +
    '<td><button class="btn btn-outline btn-sm" data-view="' + d.id + '">View</button></td>' +
    '</tr>'
  )).join('');
  const tl = app.timeline.map((t) => (
    '<li><strong>' + esc(t.label) + '</strong><div class="muted small">' + esc(t.actor) + ' - ' + fmtDate(t.created_at) + '</div></li>'
  )).join('');

  return '<div class="panel"><div class="spread"><div>' +
      '<h2>' + esc(app.full_name) + '</h2>' +
      '<p class="muted small">' + esc(app.ref_code) + ' - ' + esc(app.school) + '</p>' +
      '<p class="muted small">' + esc(app.email) + ' - ' + esc(app.phone || 'No mobile number') + '</p>' +
      '<p class="muted small">' + esc(app.address) + '</p>' +
    '</div><div style="text-align:right">' + statusBadge(app.status, app.status_label) +
      '<div class="value display" style="font-size:1.6rem">' + app.score + '</div>' +
      '<div class="muted small">Composite score</div>' +
    '</div></div>' +
    '<div class="row" style="margin-top:.75rem"><a class="btn btn-outline btn-sm" href="applications.html">Back to list</a>' +
    '<a class="btn btn-outline btn-sm" href="verification.html">Verify documents</a>' +
    '<a class="btn btn-outline btn-sm" href="approvals.html">Record a decision</a></div></div>' +
    '<div class="grid cols-2">' +
      '<div class="panel"><div class="panel-head"><h2>Documents</h2></div><div class="table-wrap"><table>' +
        '<thead><tr><th>Document</th><th>File</th><th>Status</th><th>Action</th></tr></thead><tbody>' + docs + '</tbody></table></div></div>' +
      '<div class="panel"><div class="panel-head"><h2>Timeline</h2></div><ul class="timeline">' + (tl || '<li class="muted small">No activity.</li>') + '</ul></div>' +
    '</div>';
}

let page = 1;
let total = 0;

async function load() {
  const body = document.getElementById('body');
  const q = encodeURIComponent((document.getElementById('search') || {}).value || '').trim();
  const status = (document.getElementById('filter') || {}).value || 'all';
  const docStatus = (document.getElementById('docFilter') || {}).value || 'all';

  try {
    const url = 'applications.php?page=' + page + '&per_page=10' +
      (q ? '&q=' + q : '') + '&status=' + encodeURIComponent(status) + '&doc_status=' + encodeURIComponent(docStatus);
    const data = await apiGet(url);
    total = data.total;

    const rows = (data.applications || []).map((a) => (
      '<tr><td><a href="applications.html?ref=' + encodeURIComponent(a.ref_code) + '">' + esc(a.full_name) + '</a>' +
      '<div class="muted small">' + esc(a.email) + '</div>' +
      '<div class="muted small">' + esc(a.phone || '') + '</div></td>' +
      '<td>' + esc(a.ref_code) + '</td><td>' + esc(a.school) + '</td>' +
      '<td>' + statusBadge(a.status, a.status_label) + '</td>' +
      '<td class="num">' + a.score + '</td>' +
      '<td class="num">' + a.doc_verified + '/' + a.doc_total + '</td>' +
      '<td class="muted small">' + fmtDate(a.submitted_at) + '</td></tr>'
    )).join('') || '<tr><td colspan="7" class="muted">No applications match your search.</td></tr>';

    const pages = data.pages;
    body.innerHTML =
      '<div class="panel"><div class="row">' +
        '<input type="text" id="search" placeholder="Search name, application ID, email or mobile" style="flex:1 1 260px">' +
        '<select id="filter" style="max-width:210px">' +
          '<option value="all">All statuses</option><option value="submitted">Submitted</option>' +
          '<option value="under_verification">Verification</option><option value="ranked">Ranked</option>' +
          '<option value="approved">Approved</option><option value="waitlisted">Waitlisted</option>' +
          '<option value="rejected">Rejected</option>' +
        '</select>' +
        '<select id="docFilter" style="max-width:220px">' +
          '<option value="all">All documents</option><option value="pending">Has pending documents</option>' +
          '<option value="incomplete">Not fully verified</option>' +
          '<option value="rejected">Has rejected documents</option>' +
          '<option value="verified">All verified</option>' +
        '</select></div></div>' +
      '<div class="panel"><div class="table-wrap"><table><thead><tr>' +
        '<th>Applicant</th><th>Reference</th><th>School</th><th>Status</th><th class="num">Score</th><th class="num">Docs</th><th>Submitted</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="row" style="padding:.6rem .55rem">' +
          '<span class="muted small">' + total + ' applications &middot; page ' + page + ' of ' + pages + '</span>' +
          '<button class="btn btn-outline btn-sm" id="prevBtn" type="button"' + (page > 1 ? '' : ' disabled') + '>Previous</button>' +
          '<button class="btn btn-outline btn-sm" id="nextBtn" type="button"' + (page < pages ? '' : ' disabled') + '>Next</button>' +
        '</div></div>';

    document.getElementById('filter').value = status;
    document.getElementById('docFilter').value = docStatus;
    document.getElementById('search').value = q ? decodeURIComponent(q) : '';

    const fire = () => {
      page = 1;
      load();
    };
    let timer = null;
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(fire, 300);
    });
    document.getElementById('filter').addEventListener('change', fire);
    document.getElementById('docFilter').addEventListener('change', fire);
    document.getElementById('prevBtn').addEventListener('click', () => { page -= 1; load(); });
    document.getElementById('nextBtn').addEventListener('click', () => { page += 1; load(); });
  } catch (err) {
    body.innerHTML = '<div class="alert alert-error">' + esc(err.message) + '</div>';
  }
}

initShell({ active: 'applications.html', admin: true }).then(async (session) => {
  if (!session) return;
  const ref = new URLSearchParams(location.search).get('ref');
  if (ref) {
    try {
      const data = await apiGet('applications.php?ref=' + encodeURIComponent(ref));
      const body = document.getElementById('body');
      body.innerHTML = detail(data.application);
      const byId = {};
      data.application.documents.forEach((d) => { byId[d.id] = d; });
      body.querySelectorAll('button[data-view]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const doc = byId[Number(btn.dataset.view)];
          if (doc) openDocModal(doc);
        });
      });
      document.title = data.application.full_name + ' - Paracale Scholarships';
    } catch (err) {
      document.getElementById('body').innerHTML = '<div class="alert alert-error">' + esc(err.message) + '</div>';
    }
    return;
  }
  load();
});
</script>
</body>
</html>
