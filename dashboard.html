<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Paracale Scholarships</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <div class="page-header">
    <h1>Cycle dashboard</h1>
    <p>Live overview of the 2026 scholarship cycle.</p>
  </div>
  <div id="body"></div>
</main>

<script src="assets/js/app.js"></script>
<script>
footer();
initShell({ active: 'dashboard.html', admin: true }).then(async (session) => {
  if (!session) return;
  const body = document.getElementById('body');
  try {
    const { applications: apps, budget } = await apiGet('applications.php?per_page=500');
    const count = (s) => apps.filter((a) => a.status === s).length;
    const committed = apps.filter((a) => a.status === 'approved').reduce((s, a) => s + Number(a.requested), 0);
    const pendingDocs = apps.reduce((s, a) => s + a.documents.filter((d) => d.status !== 'verified').length, 0);
    const ranked = [...apps].sort((a, b) => b.score - a.score).slice(0, 5);

    const stats = [
      ['Applications', apps.length, 'This cycle'],
      ['In verification', count('under_verification') + count('submitted'), pendingDocs + ' documents pending'],
      ['Approved', count('approved'), peso(committed) + ' committed'],
      ['Budget remaining', peso(Math.max(0, budget - committed)), 'of ' + peso(budget)],
    ].map(([l, v, h]) => '<div class="stat"><div class="label">' + l + '</div><div class="value">' + v + '</div><div class="hint">' + h + '</div></div>').join('');

    const rows = ranked.map((a, i) => (
      '<tr><td class="num">' + (i + 1) + '</td>' +
      '<td><a href="applications.html?ref=' + encodeURIComponent(a.ref_code) + '">' + esc(a.full_name) + '</a>' +
      '<div class="muted small">' + esc(a.school) + '</div></td>' +
      '<td>' + statusBadge(a.status, a.status_label) + '</td>' +
      '<td class="num">' + a.score + '</td>' +
      '<td class="num">' + peso(a.requested) + '</td></tr>'
    )).join('');

    const pct = budget ? Math.min(100, Math.round((committed / budget) * 100)) : 0;

    body.innerHTML =
      '<div class="grid cols-4">' + stats + '</div>' +
      '<div class="panel"><div class="panel-head"><h2>Budget utilisation</h2><span class="muted small">' + pct + '% committed</span></div>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div></div>' +
      '<div class="panel"><div class="panel-head"><h2>Top ranked applicants</h2><a class="btn btn-outline btn-sm" href="applications.html">All applications</a></div>' +
        '<div class="table-wrap"><table><thead><tr><th>#</th><th>Applicant</th><th>Status</th><th class="num">Score</th><th class="num">Requested</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  } catch (err) {
    body.innerHTML = '<div class="alert alert-error">' + esc(err.message) + '</div>';
  }
});
</script>
</body>
</html>
